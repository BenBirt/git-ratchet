name: 'git-ratchet checkpoint'
description: >
  Origin-side checkpoint lifecycle: record the ref, collect cosignatures from
  the policy's witnesses, evaluate quorum, store the result, and push what it
  was stored in.

inputs:
  ref:
    description: 'Full ref path to checkpoint (e.g. refs/heads/main)'
    required: true
  origin-key:
    description: 'Origin private key file contents, as written by genkey'
    required: true
  policy:
    description: 'Path to the witness policy file (relative to repo root)'
    required: true
  github-token:
    description: >
      GitHub token that can open issues on witness repositories, for
      github-issue:// witnesses.
    required: false
    default: ${{ github.token }}
  version:
    description: 'git-ratchet version to install (e.g. "v0.1.0"). Defaults to latest.'
    required: false
    default: 'latest'
  timeout:
    description: 'Seconds to wait for each witness to cosign'
    required: false
    default: '300'

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Install git-ratchet
      uses: project-oak/git-ratchet/actions/setup@07aa8aa0318cf87afc7d69ff4aaf5da5a856585d # v0.1.9
      with:
        tool: git-ratchet
        version: ${{ inputs.version }}

    # The log has to be present before a ref can be recorded in it. It does
    # not exist on a first run.
    - name: Fetch log ref
      shell: bash
      run: git fetch origin 'refs/ratchet/log:refs/ratchet/log' 2>/dev/null || true

    - name: Record the ref in the log
      shell: bash
      run: git-ratchet log --ref "${{ inputs.ref }}"

    # Push the entry before asking anyone to cosign it. The entry is the
    # durable record of where the ref pointed; a witness that is down, slow,
    # or refusing must not cost the repository that record. The next run's
    # checkpoint covers whatever the log holds by then, so nothing is lost by
    # leaving this entry uncheckpointed for now.
    - name: Push the log entry
      shell: bash
      # Not --force. Each log commit is parented on the one before, so an
      # ordinary push rejects a rewritten log before any git-ratchet code
      # runs -- which is a check worth keeping, not one to override.
      run: git push origin 'refs/ratchet/log'

    - name: Checkpoint the log
      shell: bash
      env:
        ORIGIN_KEY: ${{ inputs.origin-key }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github-token }}
      run: |
        KEYFILE="${RUNNER_TEMP}/origin.key"
        printf '%s\n' "$ORIGIN_KEY" > "$KEYFILE"
        chmod 600 "$KEYFILE"
        trap 'rm -f "$KEYFILE"' EXIT

        # No --ref: a checkpoint covers whatever the log holds.
        git-ratchet checkpoint \
          --key "$KEYFILE" \
          --policy "${{ inputs.policy }}" \
          --github-token "$GITHUB_TOKEN_INPUT" \
          --witness-timeout "${{ inputs.timeout }}s"

    - name: Push the checkpoint
      shell: bash
      run: git push origin 'refs/ratchet/log'
